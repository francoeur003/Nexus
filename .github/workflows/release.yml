name: Release

# Triggers when you push a version tag — e.g.  git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags:
      - "v[0-9]*"

jobs:
  build-and-release:
    name: Build DMG · Publish Release
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v5

      # ── 2. Xcode version ───────────────────────────────────────────────────────
      - name: Xcode version
        run: xcodebuild -version

      # ── 3. Build DMG ───────────────────────────────────────────────────────────
      # mactop is no longer installed here — v2.0 reads sensors natively (SMC + IOReport).
      - name: Build release DMG
        env:
          CI: true
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export NEXUS_VERSION="$VERSION"
          chmod +x scripts/build-dmg.sh
          ./scripts/build-dmg.sh

      # ── 4. Publish GitHub Release ──────────────────────────────────────────────
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/MacMonitor-Hermes-*.dmg \
            dist/MacMonitor-Hermes.dmg \
            --title "MacMonitor Hermes $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
