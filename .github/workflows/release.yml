name: Release

# Triggers when you push a version tag — e.g.  git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags:
      - "v[0-9]*"

jobs:
  build-and-release:
    name: Build DMG · Publish Release · Update Homebrew
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v5

      # ── 2. Xcode version ───────────────────────────────────────────────────────
      - name: Xcode version
        run: xcodebuild -version

      # ── 3. Build DMG ───────────────────────────────────────────────────────────
      # mactop is no longer installed here — v2.0 reads sensors natively (SMC + IOReport).
      - name: Build release DMG
        env:
          CI: true
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export NEXUS_VERSION="$VERSION"
          chmod +x scripts/build-dmg.sh
          ./scripts/build-dmg.sh

      # ── 4. Publish GitHub Release ──────────────────────────────────────────────
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Nexus-*.dmg \
            dist/Nexus.dmg \
            --title "Nexus $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

      # ── 5. Compute DMG SHA256 ─────────────────────────────────────────────────
      - name: Compute SHA256
        id: sha
        run: |
          SHA=$(shasum -a 256 dist/Nexus-*.dmg | awk '{print $1}')
          VERSION="${GITHUB_REF_NAME#v}"
          echo "sha256=$SHA"   >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ── 6. Update in-repo Cask ────────────────────────────────────────────────
      # Keep the in-repo Nexus cask version + SHA in sync with every release.
      - name: Update in-repo Cask
        run: |
          VERSION="${{ steps.sha.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha256 }}"
          sed -i '' "s/^  version \".*\"/  version \"${VERSION}\"/" Casks/nexus.rb
          sed -i '' "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/"       Casks/nexus.rb

      - name: Commit in-repo Cask update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/nexus.rb
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore(cask): bump in-repo cask to v${{ steps.sha.outputs.version }}"
          # Push the cask update to main so users tapping this repo get it.
          git push origin HEAD:main
